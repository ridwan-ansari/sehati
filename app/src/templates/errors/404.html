<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.tailwindcss.com;
                 style-src 'self' 'unsafe-inline' https:;
                 img-src 'self' data:;
                 frame-ancestors 'none';">
  <title>Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    :root {
      --primary: #FFC107;
      --accent: #FF9800;
      --background: #FAF9F0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.6s ease-in-out; }
  </style>
</head>
<body>
  <div class="text-center animate-fade-in">
    <h1 class="text-[8rem] font-extrabold text-[var(--primary)] leading-none">404</h1>
    <h2 class="text-3xl font-bold text-gray-800 mb-4">Oops! Page Not Found</h2>
    <p class="text-gray-600 mb-8">
      The page you’re looking for doesn’t exist or has been moved.
    </p>
    <a href="/"
       class="bg-[var(--accent)] text-white px-6 py-3 rounded-xl font-semibold hover:bg-[var(--primary)] hover:text-gray-900 transition">
       Go Back Home
    </a>
  </div>
</body>
</html>
