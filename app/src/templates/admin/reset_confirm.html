{% extends "admin/base_auth.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="bg-white shadow-xl rounded-3xl p-10 w-full max-w-md text-center animate-fade-in">
  <h2 class="text-3xl font-bold text-gray-900 mb-2">Set New Password 🔑</h2>
  <p class="text-gray-600 mb-6">Enter your new password below.</p>

  {% if error %}
  <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-6 rounded-lg text-left">
    <p>{{ error }}</p>
  </div>
  {% endif %}

  <form method="post" action="/dashboard/reset/password/confirm" class="space-y-6">
    <input type="hidden" name="token" value="{{ token }}">

    <div class="text-left">
      <label class="block text-sm font-semibold mb-1">New Password</label>
      <input type="password" name="new_password" required minlength="6"
             class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[var(--accent)] outline-none transition"
             placeholder="Enter new password">
    </div>

    <div class="text-left">
      <label class="block text-sm font-semibold mb-1">Confirm Password</label>
      <input type="password" name="confirm_password" required minlength="6"
             class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[var(--accent)] outline-none transition"
             placeholder="Confirm new password">
    </div>

    <button type="submit"
      class="w-full bg-[var(--primary)] text-gray-900 py-3 rounded-xl font-semibold hover:bg-[var(--accent)] hover:text-white transition">
      Update Password
    </button>
  </form>

  <p class="text-xs text-gray-400 mt-8">© {{ year or 2025 }} SEHATI Dashboard</p>
</div>
{% endblock %}
