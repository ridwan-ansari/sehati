{% extends "admin/base_auth.html" %}
{% block title %}Password Reset Successful{% endblock %}
{% block content %}
<div class="bg-white shadow-xl rounded-3xl p-10 w-full max-w-md text-center animate-fade-in">
  <h2 class="text-3xl font-bold text-green-700 mb-4">🎉 Password Updated!</h2>
  <p class="text-gray-600 mb-8">{{ message or "Your password has been successfully reset." }}</p>
  <a href="/dashboard/login"
     class="bg-[var(--primary)] text-gray-900 py-3 px-6 rounded-xl font-semibold hover:bg-[var(--accent)] hover:text-white transition">
     Go to Login
  </a>
  <p class="text-xs text-gray-400 mt-8">© {{ year or 2025 }} SEHATI Dashboard</p>
</div>
{% endblock %}
