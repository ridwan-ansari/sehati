{% extends "admin/base_auth.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="bg-[var(--background)] shadow-xl rounded-3xl p-10 w-full max-w-md text-center animate-fade-in">
  <h2 class="text-3xl font-bold text-gray-900 mb-2">Forgot Password 🔒</h2>
  <p class="text-gray-600 mb-6">Enter your email to receive a password reset link.</p>

  {% if success %}
  <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-3 mb-6 rounded-lg text-left">
    <p>{{ success }}</p>
  </div>
  {% endif %}

  <form method="post" action="/dashboard/reset/password" class="space-y-6">
    <div class="text-left">
      <label class="block text-sm font-semibold mb-1">Email</label>
      <input type="email" name="email" required
             class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[var(--accent)] outline-none transition"
             placeholder="you@example.com">
    </div>
    <button type="submit"
      class="w-full bg-[var(--primary)] text-gray-900 py-3 rounded-xl font-semibold hover:bg-[var(--accent)] hover:text-white transition">
      Send Reset Link
    </button>
  </form>
  <p class="text-xs text-gray-400 mt-8">© {{ year or 2025 }} SEHATI Admin Portal</p>
</div>
{% endblock %}
