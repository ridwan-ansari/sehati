<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https:;
      font-src https:;
      img-src 'self' data:;
      frame-ancestors 'none';
  ">
  <title>{% block title %}SEHATI Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    :root {
      --primary: #FFC107;
      --accent: #FF9800;
      --background: #FAF9F0;
      --sidebar-bg: #1E293B;
      --sidebar-hover: #334155;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: var(--background);
      color: #111;
    }
  </style>
</head>
<body class="flex min-h-screen bg-[var(--background)]">
  
  <aside class="w-64 bg-[var(--sidebar-bg)] text-gray-100 flex flex-col justify-between shadow-lg">
    
    <div>
      <div class="text-2xl font-bold px-6 py-6 text-[var(--primary)] border-b border-gray-700 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
        SEHATI
      </div>

      <nav class="mt-6 space-y-1">
        <a href="/dashboard/users"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
          </svg>
          Users
        </a>

        <a href="/dashboard/leaderboard"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0V5.625a1.125 1.125 0 0 1 1.125-1.125h2.25c1.056 0 2.041.008 3 .041v2.597c0 1.175-.725 2.169-1.81 2.446a12.026 12.026 0 0 1-4.565.667Zm-6.342 0h2.25a1.125 1.125 0 0 0 1.125-1.125V5.625a1.125 1.125 0 0 0-1.125-1.125H9.497M7.5 9.151V5.665c0-1.056.008-2.041.041-3 1.175 0 2.169.725 2.446 1.81a12.026 12.026 0 0 0 .667 4.565Z" />
          </svg>
           Leaderboard
        </a>

        <a href="/dashboard/recipes"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          Recipes
        </a>
        <a href="/dashboard/merchandise"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          Merchandise
        </a>
      </nav>
    </div>

    <div>
        <div class="px-6 pb-2">
            <form method="post" action="/dashboard/logout" class="w-full">
                <button type="submit" class="w-full flex items-center px-4 py-2 text-gray-300 font-semibold rounded-lg 
                                               hover:bg-red-600 hover:text-white transition-all duration-200 
                                               focus:outline-none focus:ring-2 focus:ring-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                    </svg>
                    <span>Logout</span>
                </button>
            </form>
        </div>

        <div class="text-xs text-gray-400 px-6 py-4 border-t border-gray-700">
            © {{ year or 2025 }} SEHATI Admin
        </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col">
    <section class="p-8 flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
