<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https:;
      font-src https:;
      img-src 'self' data: https:;
      frame-ancestors 'none';
  ">
  <title>{% block title %}SEHATI Admin{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

  <style>
    :root {
      --primary: #FFC107;
      --accent: #FF9800;
      --background: #FAF9F0;
      --sidebar-bg: #1E293B;
      --sidebar-hover: #334155;
      font-family: 'Inter', sans-serif;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: var(--background);
      color: #111;
    }

    /* Smooth Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Sidebar Animations */
    .sidebar {
      transition: transform 0.3s ease-in-out, width 0.3s ease;
    }

    .sidebar-hidden {
      transform: translateX(-100%);
    }

    /* Mobile Overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      display: block;
      opacity: 1;
    }

    /* Active Menu Item */
    .menu-item.active {
      background: var(--sidebar-hover);
      border-left: 4px solid var(--primary);
    }

    /* Hover Effects */
    .menu-item {
      position: relative;
      overflow: hidden;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: var(--primary);
      transform: scaleY(0);
      transition: transform 0.2s ease;
    }

    .menu-item:hover::before {
      transform: scaleY(1);
    }

    /* Loading Animation */
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Notification Badge */
    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #EF4444;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Card Hover Effect */
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-btn {
      display: none;
    }

    /* Responsive Styles */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        z-index: 50;
        height: 100vh;
        transform: translateX(-100%);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .mobile-menu-btn {
        display: flex;
      }

      .main-content {
        margin-left: 0 !important;
      }
    }

    @media (max-width: 640px) {
      .sidebar {
        width: 100% !important;
        max-width: 280px;
      }

      .page-header h1 {
        font-size: 1.5rem;
      }

      /* Stack action buttons vertically on mobile */
      .action-buttons {
        flex-direction: column;
        gap: 0.5rem;
      }

      .action-buttons > * {
        width: 100%;
      }
    }

    /* Print Styles */
    @media print {
      .sidebar, .mobile-menu-btn, .no-print {
        display: none !important;
      }
      
      .main-content {
        margin: 0 !important;
      }
    }

    /* Utility Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    /* Focus Styles for Accessibility */
    button:focus, a:focus, input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body class="flex min-h-screen bg-[var(--background)]">

  <!-- MOBILE OVERLAY -->
  <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar w-64 bg-[var(--sidebar-bg)] text-gray-100 flex flex-col justify-between shadow-lg">
    
    <div class="overflow-y-auto">
      <!-- LOGO -->
      <div class="px-6 py-6 border-b border-gray-700 flex items-center gap-3 sticky top-0 bg-[var(--sidebar-bg)] z-10">
        <img src="/static/images/logo_sehati.png"
            alt="Sehati Logo"
            class="h-10 w-auto object-contain">
        <span class="text-2xl font-bold text-[var(--primary)]">SEHATI</span>
        
        <!-- Close button for mobile -->
        <button onclick="toggleSidebar()" 
                class="ml-auto lg:hidden text-gray-400 hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
               stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- MENU -->
      <nav class="mt-6 space-y-1 px-3">

        <!-- USERS -->
        <a href="/dashboard/users"
           class="menu-item flex items-center px-4 py-3 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path.startswith('/dashboard/users') %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor"
               class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">

                  d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 
                     4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003

                     12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109
                     a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 
                     3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Z" />

        <!-- LEADERBOARD -->

           class="menu-item flex items-center px-4 py-3 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path.startswith('/dashboard/leaderboard') %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"

               class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">

                     0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5

        </a>

        <!-- RECIPES -->

           class="menu-item flex items-center px-4 py-3 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path.startswith('/dashboard/recipes') %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor"
               class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 
                     .512v14.25A8.987 8.987 0 0 1 6 18a8.967 8.967 
                     0 0 0 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292" />
          </svg>
          <span class="font-medium">Recipes</span>
        </a>

        <div class="pt-4">
          <div class="px-4 pb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
            Games
          </div>

          <a href="/dashboard/games"
             class="menu-item flex items-center px-4 py-2 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path == '/dashboard/games' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.5" stroke="currentColor"
                 class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.5 2.25l-.838 1.488a.75.75 0 0 1-.663.493H8.95a.75.75 0 0 1-.663-.493L7.5 2.25m8 0L19.5 7.5m-4 0h-7m-4 0L7.5 2.25" />
              <path stroke-linecap="round" stroke-linejoin="round"

            </svg>
            <span class="text-sm">Game List</span>
          </a>
        </div>

        <!-- MERCHANDISE SECTION -->
        <div class="pt-4">
          <div class="px-4 pb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
            Merchandise
          </div>

          <!-- Merchandise List -->
          <a href="/dashboard/merchandise"
             class="menu-item flex items-center px-4 py-2 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path == '/dashboard/merchandise' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.5" stroke="currentColor"
                 class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
            <span class="text-sm">Merchandise List</span>
          </a>

          <!-- Merchandise Claims -->
          <a href="/dashboard/merchandise/claims"
             class="menu-item flex items-center px-4 py-2 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group relative {% if request.url.path.startswith('/dashboard/merchandise/claims') %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.5"
                 stroke="currentColor" class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
            </svg>
            <span class="text-sm">Claim Requests</span>
            <!-- Notification badge example (you can dynamically add this) -->
            <!-- <span class="badge">3</span> -->
          </a>
        </div>

        <div class="pt-4">
          <div class="px-4 pb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
            Foods
          </div>
          <a href="/dashboard/foods"
            class="menu-item flex items-center px-4 py-2 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path.startswith('/dashboard/foods') %}active{% endif %}">
              <svg xmlns="http://www.w3.org/2000/svg"
                  fill="none" viewBox="0 0 24 24"
                  stroke-width="1.8" stroke="currentColor"
                  class="w-5 h-5 mr-3 text-gray-500">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M10.5 6h-5m0 0V4.5m0 1.5V7.5m0-1.5h5m8.25 12h-12a2.25 2.25 0 01-2.25-2.25v-7.5A2.25 2.25 0 016.75 6h6a2.25 2.25 0 012.25 2.25v2.25h2.25A2.25 2.25 0 0121 12.75v3a2.25 2.25 0 01-2.25 2.25z" />
              </svg>
              <span class="text-sm">List</span>
          </a>
        </div>

        <!-- POINTS SECTION -->
        <div class="pt-4">
          <div class="px-4 pb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
            Points
          </div>
          <a href="/dashboard/transactions"
            class="menu-item flex items-center px-4 py-2 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path.startswith('/dashboard/transactions') %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor"
                class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            <span class="text-sm">Point Transactions</span>
          </a>
        </div>

        <div class="pt-4">
          <div class="px-4 pb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
            Management
          </div>
          <a href="/dashboard/appointments"
            class="menu-item flex items-center px-4 py-2 rounded-lg hover:bg-[var(--sidebar-hover)] transition-all duration-200 group {% if request.url.path.startswith('/dashboard/appointments') %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor"
                class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
            </svg>
            <span class="text-sm">Appointments</span>
          </a>
        </div>

      </nav>
    </div>

    <!-- FOOTER -->
    <div class="border-t border-gray-700 mt-auto">
      <div class="px-3 py-4">
        <form method="post" action="/dashboard/logout" class="w-full">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit"
            class="w-full flex items-center justify-center px-4 py-3 text-gray-300 font-semibold rounded-lg 
                   hover:bg-red-600 hover:text-white transition-all duration-200 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.5"
                 stroke="currentColor" class="w-5 h-5 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
            </svg>
            Logout
          </button>
        </form>
      </div>

      <div class="text-xs text-gray-400 px-6 py-3 text-center">
        © {{ year or 2025 }} SEHATI Admin
      </div>
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col main-content">
    
    <!-- TOP NAVIGATION BAR (Mobile) -->
    <header class="bg-white shadow-sm px-4 py-3 lg:px-8 lg:py-4 flex items-center justify-between sticky top-0 z-30 no-print">
      <!-- Mobile Menu Button -->
      <button onclick="toggleSidebar()" 
              class="mobile-menu-btn items-center justify-center p-2 rounded-lg hover:bg-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
             stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" 
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>

      <!-- Page Title (Mobile) -->
      <h1 class="text-lg font-bold text-gray-800 lg:hidden">
        {% block mobile_title %}Dashboard{% endblock %}
      </h1>
    </header>

    <!-- CONTENT AREA -->
    <section class="p-4 sm:p-6 lg:p-8 flex-1 overflow-y-auto fade-in">
      {% block content %}{% endblock %}
    </section>
  </main>

  <!-- JAVASCRIPT -->
  <script>
    // Toggle Sidebar for Mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
      
      // Prevent body scroll when sidebar is open
      if (sidebar.classList.contains('active')) {
        document.body.style.overflow = 'hidden';
      } else {
        document.body.style.overflow = '';
      }
    }

    // Close sidebar when clicking menu item (mobile only)
    document.addEventListener('DOMContentLoaded', function() {
      const menuItems = document.querySelectorAll('.menu-item');
      
      menuItems.forEach(item => {
        item.addEventListener('click', function() {
          if (window.innerWidth < 1024) {
            toggleSidebar();
          }
        });
      });

      // Close sidebar on window resize if > 1024px
      window.addEventListener('resize', function() {
        if (window.innerWidth >= 1024) {
          const sidebar = document.getElementById('sidebar');
          const overlay = document.getElementById('overlay');
          
          sidebar.classList.remove('active');
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    });

    // Add loading state to forms
    document.addEventListener('DOMContentLoaded', function() {
      const forms = document.querySelectorAll('form');
      
      forms.forEach(form => {
        form.addEventListener('submit', function(e) {
          const submitBtn = form.querySelector('button[type="submit"]');
          if (submitBtn && !submitBtn.disabled) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading-spinner mx-auto"></div>';
          }
        });
      });
    });

    // Toast notification function (can be used for success/error messages)
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 fade-in ${
        type === 'success' ? 'bg-green-500' : 'bg-red-500'
      }`;
      toast.textContent = message;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Smooth scroll to top
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    {% block extra_js %}{% endblock %}
  </script>

</body>
</html>
