<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https:;
      font-src https:;
      img-src 'self' data:;
      frame-ancestors 'none';
  ">
  <title>{% block title %}SEHATI Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    :root {
      --primary: #FFC107;
      --accent: #FF9800;
      --background: #FAF9F0;
      --sidebar-bg: #1E293B;
      --sidebar-hover: #334155;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: var(--background);
      color: #111;
    }
  </style>
</head>
<body class="flex min-h-screen bg-[var(--background)]">
  <aside class="w-64 bg-[var(--sidebar-bg)] text-gray-100 flex flex-col justify-between shadow-lg">
    <div>
      <div class="text-2xl font-bold px-6 py-6 text-[var(--primary)] border-b border-gray-700">
        SEHATI Admin
      </div>
      <nav class="mt-6">
        <a href="/dashboard/users"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-3">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 19l-7-7 7-7" />
          </svg>
          Users
        </a>
        <a href="/dashboard/leaderboard"
          class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 17h4v4H3v-4zm7-6h4v10h-4V11zm7-8h4v18h-4V3z" />
            </svg>
            Leaderboard
        </a>
        <a href="/dashboard/recipes"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-3">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 19l-7-7 7-7" />
          </svg>
          Recipes
        </a>
      </nav>
    </div>
    <div class="text-xs text-gray-400 px-6 py-4 border-t border-gray-700">
      © {{ year or 2025 }} SEHATI Admin
    </div>
  </aside>

  <main class="flex-1 flex flex-col">
    <header class="bg-[var(--primary)] shadow-md flex justify-between items-center px-8 py-4">
      <h1 class="text-lg font-semibold text-gray-900">{% block header %}{% endblock %}</h1>
      <form method="post" action="/dashboard/logout">
        <button class="bg-red-600 text-white px-4 py-2 rounded-xl font-semibold hover:opacity-90 transition">
          Logout
        </button>
      </form>
    </header>

    <section class="p-8 flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
