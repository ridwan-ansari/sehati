<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https:;
      font-src https:;
      img-src 'self' data:;
      frame-ancestors 'none';
  ">
  <title>{% block title %}SEHATI Admin{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

  <style>
    :root {
      --primary: #FFC107;
      --accent: #FF9800;
      --background: #FAF9F0;
      --sidebar-bg: #1E293B;
      --sidebar-hover: #334155;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: var(--background);
      color: #111;
    }
  </style>
</head>

<body class="flex min-h-screen bg-[var(--background)]">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-[var(--sidebar-bg)] text-gray-100 flex flex-col justify-between shadow-lg">
    
    <div>
      <!-- LOGO -->
      <div class="text-2xl font-bold px-6 py-6 text-[var(--primary)] border-b border-gray-700 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke="currentColor" class="size-8">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
        SEHATI
      </div>

      <!-- MENU -->
      <nav class="mt-6 space-y-1">

        <!-- USERS -->
        <a href="/dashboard/users"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor"
               class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 
                     4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003 
                     c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 
                     12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109
                     a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 
                     3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Z" />
          </svg>
          Users
        </a>

        <!-- LEADERBOARD -->
        <a href="/dashboard/leaderboard"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor"
               class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 
                     0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 
                     18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872" />
          </svg>
          Leaderboard
        </a>

        <!-- RECIPES -->
        <a href="/dashboard/recipes"
           class="flex items-center px-6 py-3 hover:bg-[var(--sidebar-hover)] transition group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor"
               class="w-5 h-5 mr-3 group-hover:text-[var(--primary)] transition-colors">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 
                     .512v14.25A8.987 8.987 0 0 1 6 18a8.967 8.967 
                     0 0 0 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292" />
          </svg>
          Recipes
        </a>

        <!-- MERCHANDISE MAIN -->
        <div>
          <div class="px-6 pt-4 pb-1 text-xs font-bold text-gray-400 uppercase tracking-wide">
            Merchandise
          </div>

          <!-- Merchandise List -->
          <a href="/dashboard/merchandise"
             class="flex items-center px-8 py-2 hover:bg-[var(--sidebar-hover)] transition group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.5" stroke="currentColor"
                 class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 3h18M3 7.5h18M3 12h18M3 16.5h18M3 21h18" />
            </svg>
            Merchandise List
          </a>

          <!-- Merchandise Claims -->
          <a href="/dashboard/merchandise/claims"
             class="flex items-center px-8 py-2 hover:bg-[var(--sidebar-hover)] transition group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.5"
                 stroke="currentColor" class="w-4 h-4 mr-3 group-hover:text-[var(--primary)]">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 3h18v4H3zm0 14h18v4H3zm0-7h12v4H3z" />
            </svg>
            Claim Requests
          </a>
        </div>

      </nav>
    </div>

    <!-- FOOTER -->
    <div>
      <div class="px-6 pb-2">
        <form method="post" action="/dashboard/logout" class="w-full">
          <button type="submit"
            class="w-full flex items-center px-4 py-2 text-gray-300 font-semibold rounded-lg 
                   hover:bg-red-600 hover:text-white transition-all duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.5"
                 stroke="currentColor" class="w-5 h-5 mr-3">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6" />
            </svg>
            Logout
          </button>
        </form>
      </div>

      <div class="text-xs text-gray-400 px-6 py-4 border-t border-gray-700">
        © {{ year or 2025 }} SEHATI Admin
      </div>
    </div>

  </aside>

  <main class="flex-1 flex flex-col">
    <section class="p-8 flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </section>
  </main>

</body>
</html>
