{% extends "admin/base.html" %}
{% block title %}Create Food{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg">

    <h2 class="text-2xl font-bold mb-4">Add New Food</h2>

    <form method="post" class="space-y-4">

        <div>
            <label class="font-semibold">Food Name</label>
            <input type="text" name="name" required
                   class="w-full px-3 py-2 border rounded-lg focus:ring focus:border-blue-500">
        </div>

        <div>
            <label class="font-semibold">Calories (/100gram)</label>
            <input type="number" name="calories" required
                   class="w-full px-3 py-2 border rounded-lg focus:ring focus:border-blue-500">
        </div>

        <div>
            <label class="font-semibold">Unit</label>
            <input type="text" name="unit" value="kcal"
                   class="w-full px-3 py-2 border rounded-lg focus:ring focus:border-blue-500">
        </div>

        <div class="flex justify-end">
            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow hover:bg-blue-700">
                Save Food
            </button>
        </div>

    </form>
</div>

{% endblock %}
