{% extends "admin/base.html" %}
{% block title %}Play {{ game.name }}{% endblock %}

{% block content %}
<div class="bg-white shadow-xl rounded-xl p-4 mb-4">
    <h2 class="text-2xl font-bold">{{ game.name }}</h2>
    <p class="text-gray-600">{{ game.description }}</p>
</div>

<div class="shadow-xl rounded-xl overflow-hidden" style="height:80vh;">
    <iframe src="{{ game.url }}" class="w-full h-full border-none"></iframe>
</div>
{% endblock %}
