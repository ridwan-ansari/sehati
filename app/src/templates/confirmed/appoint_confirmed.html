<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.tailwindcss.com;
                 style-src 'self' 'unsafe-inline' https:;
                 img-src 'self' data:;
                 frame-ancestors 'none';">
  <title>Appointment Dikonfirmasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    :root {
      --primary: #FFC107;
      --accent: #FF9800;
      --background: #FAF9F0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.6s ease-in-out; }
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: block;
      stroke-width: 3;
      stroke: #4CAF50;
      stroke-miterlimit: 10;
      margin: 0 auto 24px;
      animation: scale 0.3s ease-in-out 0.9s both;
    }
    .checkmark__circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3;
      stroke: #4CAF50;
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .checkmark__check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
    }
    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scale {
      0%, 100% { transform: none; }
      50% { transform: scale3d(1.1, 1.1, 1); }
    }
  </style>
</head>
<body>
  <div class="text-center animate-fade-in max-w-lg px-6">
    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
      <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
      <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
    </svg>
    
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Appointment Dikonfirmasi</h1>
    <p class="text-gray-700 mb-6">
      Email konfirmasi telah dikirim. Silakan lanjutkan komunikasi melalui email atau telepon yang tertera pada email konfirmasi.
    </p>
    <a href="/"
       class="inline-block bg-[var(--accent)] text-white px-8 py-3 rounded-xl font-semibold hover:bg-[var(--primary)] hover:text-gray-900 transition shadow-md">
       Kembali ke Beranda
    </a>
  </div>
</body>
</html>
