<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F5F5F0; font-family: Arial, Helvetica, sans-serif; }
    .wrapper { max-width: 600px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .header { background: #1E293B; padding: 28px 32px; text-align: center; }
    .header-brand { color: #FFC107; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { color: #94A3B8; font-size: 12px; margin-top: 4px; }
    .body { padding: 36px 32px; color: #374151; font-size: 15px; line-height: 1.75; }
    .body p { margin-bottom: 14px; }
    .body a { color: #FF9800; }
    .body ul, .body ol { padding-left: 20px; margin-bottom: 14px; }
    .body li { margin-bottom: 6px; }
    .body strong, .body b { color: #111827; }
    .divider { height: 1px; background: #F3F4F6; }
    .footer { background: #F9FAF8; padding: 20px 32px; text-align: center; }
    .footer p { color: #9CA3AF; font-size: 12px; line-height: 1.6; }
    .footer a { color: #FFC107; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">

      <div class="header">
        <div class="header-brand">SEHATI</div>
        <div class="header-sub">Health Monitoring Platform</div>
      </div>

      <div class="body">
        {{ body | safe }}
      </div>

      <div class="divider"></div>

      <div class="footer">
        <p>© {{ year }} SEHATI — Health Monitoring Platform</p>
        <p style="margin-top: 6px;">Email ini dikirim oleh tim Admin SEHATI.</p>
      </div>

    </div>
  </div>
</body>
</html>
