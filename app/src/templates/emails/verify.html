<!doctype html>
<html lang="en" style="background:#FAF9F0;margin:0;padding:0;">
  <head>
    <meta charset="utf-8">
    <title>MRA Verification</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
  </head>
  <body style="margin:0;padding:24px;background:#FAF9F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;color:#111;">
    <table width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee">
      <tr>
        <td style="background:#FFC107;padding:20px 24px;">
          <h1 style="margin:0;font-size:20px;color:#111;">MRA — Account Verification</h1>
        </td>
      </tr>
      <tr>
        <td style="padding:24px;">
          <p style="margin:0 0 12px;">Hi {{ fullname or 'there' }},</p>
          <p style="margin:0 0 16px;">Your verification code is:</p>

          <div style="text-align:center;margin:20px 0;">
            <div style="display:inline-block;padding:14px 24px;border-radius:12px;background:#111;color:#fff;font-weight:700;letter-spacing:2px;font-size:28px;">
              {{ code }}
            </div>
          </div>

          <p style="margin:0 0 8px;color:#444;">Please enter this 6-digit code in the app to verify your account.</p>
          <p style="margin:0 0 0;color:#666;font-size:12px;">If you didn’t request this verification, you can safely ignore this email.</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 24px;background:#FAF9F0;color:#666;font-size:12px;text-align:center;">
          © {{ year }} MRA Dashboard
        </td>
      </tr>
    </table>
  </body>
</html>
